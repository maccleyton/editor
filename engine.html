<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEXUS MATH ENGINE</title>

<!-- MathGuard (MathJax Config) -->
<script>
  window.MathJax = {
    tex: { inlineMath:[['$','$'],['\\(','\\)']], displayMath:[['$$','$$'],['\\[','\\]']], processEscapes:true },
    options: { skipHtmlTags:['script','noscript','style','textarea','pre'] },
    startup: { typeset:false }
  };
</script>
<script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js" async></script>

<style>
@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Rajdhani:wght@500;700&family=Exo+2:wght@300;400;600&display=swap');

:root {
  --bg-void: #080909; --bg-deep: #0d0f10; --bg-surface: #111415; 
  --bg-panel: #161a1b; --bg-card: #222628;
  --border-dim: rgba(140,200,230,0.09); --border-mid: rgba(140,200,230,0.20);
  --border-bright: rgba(140,200,230,0.48); --border-active: rgba(56,200,240,0.80);
  --cyan-base: #38c8f0; --cyan-bright: #72dcf8; --cyan-glow: rgba(56,200,240,0.18);
  --amber: #ffc233; --red-alert: #ff5555; --green-ok: #3dffa0;
  --text-primary: #f0f6fa; --text-secondary: #b8d0dc; --text-muted: #7aaabb;
  
  --font-mono: 'JetBrains Mono', monospace; --font-ui: 'Rajdhani', sans-serif; --font-body: 'Exo 2', sans-serif;
}

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;background:var(--bg-void);color:var(--text-primary);font-family:var(--font-body);font-size:14px;overflow:hidden;}

/* Utilities */
.bracket-corner{position:fixed;width:20px;height:20px;pointer-events:none;z-index:9998;}
.bracket-corner.tl{top:8px;left:8px;border-top:2px solid var(--border-bright);border-left:2px solid var(--border-bright);}
.bracket-corner.tr{top:8px;right:8px;border-top:2px solid var(--border-bright);border-right:2px solid var(--border-bright);}
.bracket-corner.bl{bottom:8px;left:8px;border-bottom:2px solid var(--border-bright);border-left:2px solid var(--border-bright);}
.bracket-corner.br{bottom:8px;right:8px;border-bottom:2px solid var(--border-bright);border-right:2px solid var(--border-bright);}

/* Layout */
#app-header{height:48px;background:var(--bg-deep);border-bottom:1px solid var(--border-mid);display:flex;align-items:center;padding:0 20px;gap:16px;}
#main-layout{display:flex;height:calc(100vh - 48px);}

/* Left Panel - Input */
#input-panel{flex:0 0 400px;background:var(--bg-surface);border-right:1px solid var(--border-dim);display:flex;flex-direction:column;}
.panel-hdr{height:34px;padding:0 16px;border-bottom:1px solid var(--border-dim);display:flex;align-items:center;justify-content:space-between;font-family:var(--font-mono);font-size:10px;color:var(--text-muted);letter-spacing:2px;text-transform:uppercase;}
#equation-input{flex:1;background:transparent;border:none;color:var(--cyan-bright);font-family:var(--font-mono);font-size:16px;padding:20px;resize:none;outline:none;line-height:1.6;}
#equation-input::placeholder{color:var(--text-ghost);opacity:0.5;}

.controls{padding:20px;border-top:1px solid var(--border-dim);background:var(--bg-panel);}
.btn-solve{width:100%;display:flex;align-items:center;justify-content:center;gap:10px;background:var(--cyan-glow);border:1px solid var(--cyan-base);color:var(--cyan-base);font-family:var(--font-ui);font-weight:700;font-size:14px;letter-spacing:3px;text-transform:uppercase;padding:12px;cursor:pointer;transition:all 0.2s;clip-path:polygon(10px 0%,100% 0%,calc(100% - 10px) 100%,0% 100%);}
.btn-solve:hover{background:var(--cyan-base);color:var(--bg-void);box-shadow:0 0 20px rgba(56,200,240,0.4);}
.btn-solve:disabled{background:transparent;border-color:var(--text-muted);color:var(--text-muted);cursor:not-allowed;box-shadow:none;}

/* Right Panel - Output */
#output-panel{flex:1;background:var(--bg-deep);display:flex;flex-direction:column;position:relative;overflow:hidden;}
#resolution-core{flex:1;padding:40px;overflow-y:auto;}

/* Resolution Steps Styling */
.step-container{opacity:0;transform:translateY(20px);animation:fadeUp 0.5s forwards;margin-bottom:30px;padding-left:20px;border-left:2px solid var(--border-mid);position:relative;}
.step-container::before{content:'';position:absolute;left:-5px;top:0;width:8px;height:8px;background:var(--bg-deep);border:2px solid var(--cyan-mid);border-radius:50%;}
.step-desc{font-family:var(--font-body);font-size:13px;color:var(--text-secondary);margin-bottom:10px;}
.step-math{background:var(--bg-card);padding:15px;border:1px solid var(--border-dim);border-radius:4px;color:var(--cyan-bright);overflow-x:auto;}

.final-result-container{opacity:0;transform:scale(0.95);animation:fadeUp 0.6s forwards;margin-top:40px;background:linear-gradient(45deg, rgba(56,200,240,0.1), transparent);border:1px solid var(--cyan-base);padding:30px;text-align:center;position:relative;overflow:hidden;}
.final-result-label{font-family:var(--font-mono);font-size:10px;color:var(--cyan-base);letter-spacing:4px;text-transform:uppercase;margin-bottom:15px;}
.final-result-math{font-size:24px;color:#fff;}

/* Loading State */
#scanning-overlay{position:absolute;inset:0;background:rgba(13,15,16,0.9);backdrop-filter:blur(4px);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:100;opacity:0;pointer-events:none;transition:opacity 0.3s;}
#scanning-overlay.active{opacity:1;pointer-events:all;}
.scan-line{width:200px;height:2px;background:var(--cyan-base);box-shadow:0 0 10px var(--cyan-base);margin-bottom:20px;animation:scan 1.5s infinite ease-in-out;}
.scan-text{font-family:var(--font-mono);font-size:12px;letter-spacing:4px;color:var(--cyan-base);animation:pulse 1s infinite;}

@keyframes fadeUp{ to{opacity:1;transform:translateY(0) scale(1);} }
@keyframes scan{ 0%,100%{transform:scaleX(0.2);opacity:0.2;} 50%{transform:scaleX(1);opacity:1;} }
@keyframes pulse{ 0%,100%{opacity:1;} 50%{opacity:0.5;} }

/* Status Bar */
#error-box{display:none;background:rgba(255,85,85,0.1);border-left:4px solid var(--red-alert);padding:15px;margin:20px;font-family:var(--font-mono);font-size:12px;color:var(--red-alert);}
</style>
</head>
<body>

<!-- UI Corners -->
<div class="bracket-corner tl"></div><div class="bracket-corner tr"></div>
<div class="bracket-corner bl"></div><div class="bracket-corner br"></div>

<!-- Header -->
<header id="app-header">
  <span style="font-size:20px; color:var(--cyan-base);">🜂</span>
  <div style="font-family:var(--font-ui); font-weight:700; font-size:16px; color:var(--cyan-base); letter-spacing:3px;">NEXUS MATH ENGINE</div>
  <div style="width:1px;height:20px;background:var(--border-mid);"></div>
  <span style="font-family:var(--font-mono); font-size:10px; color:var(--amber); letter-spacing:2px;">MÓDULO DE RESOLUÇÃO ASSINTÓTICA</span>
</header>

<div id="main-layout">
  <!-- Input Panel -->
  <div id="input-panel">
    <div class="panel-hdr">
      <span style="color:var(--cyan-mid);">ENTRADA DE DADOS (LaTeX)</span>
      <button onclick="insertSample()" style="background:transparent;border:1px solid var(--border-mid);color:var(--text-secondary);font-family:var(--font-mono);font-size:9px;padding:3px 8px;cursor:pointer;">Exemplo</button>
    </div>
    <textarea id="equation-input" placeholder="Digite a equação estrutural...&#10;&#10;Ex: \int_{0}^{\pi} \sin(x) dx" spellcheck="false"></textarea>
    <div class="controls">
      <button id="btn-solve" class="btn-solve" onclick="startResolution()">
        <span>∑</span><span>PROCESSAR MATRIZ</span>
      </button>
    </div>
  </div>

  <!-- Output Panel -->
  <div id="output-panel">
    <div class="panel-hdr">
      <span style="color:var(--text-muted);">CORE ANALÍTICO</span>
      <span id="status-tag" style="color:var(--text-ghost);">Aguardando Entrada</span>
    </div>
    
    <div id="scanning-overlay">
      <div class="scan-line"></div>
      <div class="scan-text" id="scan-log">ANALISANDO TENSORES...</div>
    </div>

    <div id="error-box"></div>

    <div id="resolution-core">
      <!-- As etapas serão injetadas aqui -->
      <div style="height:100%;display:flex;align-items:center;justify-content:center;opacity:0.2;flex-direction:column;gap:15px;pointer-events:none;">
        <span style="font-size:48px;">◈</span>
        <span style="font-family:var(--font-mono);font-size:12px;letter-spacing:5px;">SISTEMA OCIOSO</span>
      </div>
    </div>
  </div>
</div>

<script>
// A API Key é injetada nativamente pelo ambiente de execução Canvas
const apiKey = ""; 

// Configuração do modelo e endpoint (Conforme diretrizes de ambiente)
const MODEL_NAME = "gemini-2.5-flash-preview-09-2025";
const API_URL = `https://generativelanguage.googleapis.com/v1beta/models/${MODEL_NAME}:generateContent?key=${apiKey}`;

// Prompt de Sistema rigoroso para o formato JSON
const SYSTEM_INSTRUCTION = `
Você é o "Nexus Math Engine", um núcleo avançado de computação algébrica ("Hard Sci-Fi" theme).
Sua função é resolver a equação matemática ou problema em LaTeX fornecido pelo usuário.
Você DEVE resolver a equação passo-a-passo.
Responda APENAS em um formato JSON válido, usando o schema exigido.
As descrições (explanations) devem estar em Português do Brasil, com um tom técnico e analítico.
Os campos de "latex" devem conter EXATAMENTE o código LaTeX limpo, sem delimitadores markdown como \`\`\`latex.
`;

// Schema que força o Gemini a devolver um JSON perfeito e estruturado
const GENERATION_CONFIG = {
  responseMimeType: "application/json",
  responseSchema: {
    type: "OBJECT",
    properties: {
      steps: {
        type: "ARRAY",
        description: "A lista de passos sequenciais para resolver o problema.",
        items: {
          type: "OBJECT",
          properties: {
            explanation: { 
              type: "STRING", 
              description: "A explicação da operação matemática aplicada neste passo." 
            },
            latex: { 
              type: "STRING", 
              description: "O código LaTeX representando o estado da equação neste passo. Não inclua $$." 
            }
          },
          required: ["explanation", "latex"]
        }
      },
      finalResult: {
        type: "STRING",
        description: "O código LaTeX representando apenas a resposta final e simplificada."
      }
    },
    required: ["steps", "finalResult"]
  }
};

// ==========================================
// FUNÇÕES DE UI E CONTROLE
// ==========================================

function insertSample() {
  document.getElementById('equation-input').value = `\\frac{d}{dx} \\left( x^3 \\ln(x) \\right) = 0`;
}

function showError(msg) {
  const eb = document.getElementById('error-box');
  eb.style.display = 'block';
  eb.textContent = `[ERRO DO SISTEMA]: ${msg}`;
  document.getElementById('scanning-overlay').classList.remove('active');
  document.getElementById('btn-solve').disabled = false;
  document.getElementById('btn-solve').innerHTML = `<span>∑</span><span>PROCESSAR MATRIZ</span>`;
}

function clearUI() {
  document.getElementById('error-box').style.display = 'none';
  document.getElementById('resolution-core').innerHTML = '';
}

// ==========================================
// LÓGICA DE CHAMADA DA API (COM RETRY)
// ==========================================

async function fetchResolution(equationText, retryCount = 0) {
  const payload = {
    systemInstruction: { parts: [{ text: SYSTEM_INSTRUCTION }] },
    contents: [{ parts: [{ text: `Resolva passo a passo: ${equationText}` }] }],
    generationConfig: GENERATION_CONFIG
  };

  try {
    const response = await fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });

    if (!response.ok) {
      throw new Error(`Status ${response.status}: ${response.statusText}`);
    }

    const data = await response.json();
    const textOutput = data.candidates?.[0]?.content?.parts?.[0]?.text;
    
    if (!textOutput) throw new Error("A API não retornou conteúdo textual.");
    
    return JSON.parse(textOutput); // Converte a string JSON para Objeto
    
  } catch (error) {
    // Implementação de Exponential Backoff para resiliência
    if (retryCount < 4) {
      const delay = Math.pow(2, retryCount) * 1000;
      document.getElementById('scan-log').textContent = `FALHA DE COMUNICAÇÃO. RETENTATIVA EM ${delay/1000}s...`;
      await new Promise(res => setTimeout(res, delay));
      document.getElementById('scan-log').textContent = `RECONECTANDO AO NÚCLEO...`;
      return fetchResolution(equationText, retryCount + 1);
    }
    throw error;
  }
}

// ==========================================
// INJEÇÃO DA RESOLUÇÃO E RENDERIZAÇÃO
// ==========================================

async function startResolution() {
  const inputEl = document.getElementById('equation-input');
  const eq = inputEl.value.trim();
  
  if (!eq) {
    showError("A matriz de entrada está vazia. Insira uma equação.");
    return;
  }

  // Prepara Interface
  clearUI();
  const btn = document.getElementById('btn-solve');
  btn.disabled = true;
  btn.innerHTML = `<span>↻</span><span>CALCULANDO...</span>`;
  document.getElementById('scanning-overlay').classList.add('active');
  document.getElementById('scan-log').textContent = 'COMPILANDO ÁRVORE DE SINTAXE...';
  document.getElementById('status-tag').textContent = 'Processando';
  document.getElementById('status-tag').style.color = 'var(--amber)';

  try {
    // Consulta a IA
    const resolutionData = await fetchResolution(eq);
    
    document.getElementById('scan-log').textContent = 'RENDERIZANDO CÁLCULOS...';
    document.getElementById('scanning-overlay').classList.remove('active');
    
    // Injeta na UI de forma sequencial para efeito Sci-Fi
    renderSteps(resolutionData.steps, resolutionData.finalResult);

  } catch (err) {
    showError(err.message);
  }
}

async function renderSteps(steps, finalResult) {
  const core = document.getElementById('resolution-core');
  
  // Renderiza cada passo com delay
  for (let i = 0; i < steps.length; i++) {
    const step = steps[i];
    
    const div = document.createElement('div');
    div.className = 'step-container';
    div.style.animationDelay = `${i * 0.2}s`; // Atraso em cascata
    
    div.innerHTML = `
      <div class="step-desc">[Passo ${i+1}]: ${step.explanation}</div>
      <div class="step-math">$$${step.latex}$$</div>
    `;
    
    core.appendChild(div);
  }

  // Renderiza Resultado Final
  const finalDiv = document.createElement('div');
  finalDiv.className = 'final-result-container';
  finalDiv.style.animationDelay = `${steps.length * 0.2 + 0.5}s`;
  finalDiv.innerHTML = `
    <div class="final-result-label">RESULTADO ABSOLUTO</div>
    <div class="final-result-math">$$${finalResult}$$</div>
  `;
  core.appendChild(finalDiv);

  // Aciona MathJax para renderizar todos os $$ recém inseridos
  if (window.MathJax && window.MathJax.typesetPromise) {
    await MathJax.typesetPromise([core]);
  }

  // Finaliza UI
  document.getElementById('btn-solve').disabled = false;
  document.getElementById('btn-solve').innerHTML = `<span>∑</span><span>PROCESSAR NOVA MATRIZ</span>`;
  document.getElementById('status-tag').textContent = 'Resolução Concluída';
  document.getElementById('status-tag').style.color = 'var(--green-ok)';
  
  // Scroll suave para o final
  setTimeout(() => {
    core.scrollTo({ top: core.scrollHeight, behavior: 'smooth' });
  }, 500);
}

</script>
</body>
</html>
